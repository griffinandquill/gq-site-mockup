<!--
  Layered Griffin and Quill mark.
  Groups: wing-far, gryphon-body, wing-near, gryphon-head, quill.
  data-pivot is the shoulder, in viewBox pixels, for the flap.
  Rest pose is the glide. Positive rotation lifts a wing; negative rotation lowers it.
-->
